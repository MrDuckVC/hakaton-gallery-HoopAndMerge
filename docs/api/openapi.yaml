      "required":
        - "id"
        - "request_id"
        - "guide_id"
        - "exhibit_id"
        - "status"
        - "user_message"
        - "assistant_message"
        - "error"
      "allOf":
        -
          "if":
            "properties":
              "status":
                "const": "completed"
          "then":
            "properties":
              "assistant_message":
                "$ref": "#/components/schemas/DialogMessage"
              "error":
                "type": "null"
        -
          "if":
            "properties":
              "status":
                "const": "failed"
          "then":
            "properties":
              "assistant_message":
                "type": "null"
              "error":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "code":
                    "type": "string"
                    "enum":
                      - "AI_TIMEOUT"
                      - "AI_UNAVAILABLE"
                      - "SERVER_RESTARTED"
                      - "CANCELLED"
                      - "AI_OUTPUT_LIMIT"
                  "message":
                    "type": "string"
                  "retryable":
                    "type": "boolean"
                "required":
                  - "code"
                  - "message"
                  - "retryable"
        -
          "if":
            "properties":
              "status":
                "enum":
                  - "queued"
                  - "running"
          "then":
            "properties":
              "assistant_message":
                "type": "null"
              "error":
                "type": "null"
    "GenerationPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Generation"
        "next_before":
          "anyOf":
            -
              "type": "string"
              "minLength": 1
              "maxLength": 128
              "pattern": "^[\\x21-\\x7E]+$"
            -
              "type": "null"
      "required":
        - "items"
        - "next_before"
